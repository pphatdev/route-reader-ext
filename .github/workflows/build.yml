name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension
        run: npx --yes @vscode/vsce package --out route-reader-ext.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: route-reader-ext-${{ github.sha }}
          path: route-reader-ext.vsix
          if-no-files-found: error
          retention-days: 14
